name: CI

# 나쁜 머지를 막는 게이트. main 으로의 PR 과 main 푸시에서 돈다.
# 실제 배포는 여기가 아니라 deploy.yml 이 맡는다 — 이 CI 가 main 에서 성공하면 workflow_run 으로
# Deploy 가 이어 돈다(ADR-0016). 즉 이 워크플로는 "초록이어야 머지·배포된다"는 관문이다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 손으로 깨울 수 있어야 한다. 실제로 GitHub 이 main 머지 push 에 워크플로를 아예 만들지
  # 않은 적이 있다(#41 머지, check-runs 0 — Actions·GitHub 둘 다 정상이었다). 그때 CI 를
  # 깨울 방법이 없어 배포가 멈췄고, main 에 빈 커밋을 올려 우회해야 했다. 이 트리거가 있으면
  # 이력을 더럽히지 않고 다시 태운다. deploy.yml 도 이 이벤트를 받도록 맞춰 뒀다.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 게이트 · format·lint·typecheck·boundaries·unit·build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 로컬 검증과 같은 메이저(26)로 고정 — "로컬은 되는데 CI 는 깨지는" 표류를 줄인다.
          node-version: 26
          cache: npm
      # npm ci 는 package.json 의 allowScripts 승인 목록을 따라 workerd·esbuild·sharp
      # postinstall 을 실행한다(npm 11 의 스크립트 게이팅). 이게 없으면 esbuild 바이너리가
      # 안 깔려 build 가 깨진다.
      - run: npm ci
      - name: format:check
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      # next-env.d.ts 는 생성물이지만 커밋한다(AGENTS.md) — 그래야 typecheck 가 build 를
      # 선행하지 않고도 선다. 그런데 **dev 서버가 그 파일을 `.next/dev/types/...` 로 다시
      # 쓴다**: 로컬에서 e2e 를 돌린 뒤 무심코 커밋하면 dev 전용 경로가 저장소에 들어가고,
      # dev 를 안 돌리는 환경에선 typegen 이 그걸 도로 덮어 검증만 해도 트리가 더러워진다.
      # 위 typecheck(=next typegen + tsc)가 방금 정본 경로를 썼으므로, 여기서 diff 가 나면
      # 커밋된 값이 틀렸다는 뜻이다. 2026-07-26 에 같은 실수를 두 번 해서 기계로 옮겼다.
      - name: 생성 타입 선언이 dev 산출물을 가리키지 않는다
        run: git diff --exit-code -- next-env.d.ts
      - name: boundaries (dependency-cruiser)
        run: npm run boundaries
      # 커버리지는 vitest.config 에서 항상 켜져 있고 임계치(래칫)를 못 넘기면 여기서 죽는다 —
      # 별도 스텝·별도 스크립트가 아니라 `npm test` 하나로 로컬과 CI 가 같은 판정을 낸다.
      - name: unit + 커버리지 래칫 (Vitest · Workers pool)
        run: npm test
      # 임계치를 못 넘겨 죽었을 때 "어디가 안 덮였나"를 클릭으로 보게 한다. 실패했을 때가
      # 가장 필요한 순간이라 !cancelled() 로 성공·실패 양쪽에서 올린다.
      - name: 커버리지 리포트 업로드
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      # 스키마↔마이그레이션 정합성(드리프트) 검증. 마이그레이션이 실제로 적용되는지는 unit 이
      # 이미 증명한다(applyD1Migrations 로 workerd D1 에 적용). 오프라인이라 CF 인증 불요.
      - name: db 마이그레이션 정합성 (drizzle-kit check)
        run: npx drizzle-kit check
      - name: build (next build)
        run: npm run build

      # next build 가 통과해도 실제 배포 번들러는 거부할 수 있다 — Node 미들웨어가 그랬다
      # (게이트 전부 초록, 배포에서만 실패). 배포와 같은 빌드를 게이트에서 돌려 미리 잡는다.
      - name: 배포 빌드 (opennextjs-cloudflare build)
        run: npx opennextjs-cloudflare build

      # 검증 층 4(ADR-0029) — **빌드가 성립하는 것과 그 번들이 부팅해 페이지를 서빙하는 것은
      # 다른 사실이다.** 위 스텝은 앞의 것만 본다. 여기서 방금 만든 .open-next 번들을 진짜
      # workerd 로 띄우고, 층 5(배포 후 스모크)와 **같은 스크립트**를 로컬 origin 에 대고 돌린다.
      # 배포 전에 도는 유일한 "실제로 서빙되는가" 검사다.
      #
      # 스키마가 없으면 games 페이지가 500 이므로 마이그레이션을 먼저 건다(--local 이라 CF 인증
      # 불요). **시드는 안 넣는다** — 빈 목록도 렌더돼야 맞다. 이건 짐작이 아니라 실측이다:
      # 개발 머신의 `.wrangler/state` 는 e2e 가 이미 픽스처로 채워 둔 상태라 "행이 없을 때"를
      # 재현하지 못하므로, 스크래치 상태 디렉터리(`--persist-to`)에 스키마만 적용해 따로 확인했다
      # (2026-07-30). 특히 `/schedule` 은 발행된 주가 **하나도 없는** 상태를 e2e 픽스처가 만들지
      # 않는데, 그 상태에서도 200 + 마커로 렌더된다.
      - name: 로컬 D1 스키마 (배포 번들 스모크용)
        run: npm run db:migrate:local
      # 스텝 시한을 둔다 — 이게 없으면 wrangler 가 안 뜨거나 스모크가 매달릴 때 job 이 기본
      # 워크플로 타임아웃(수십 분)까지 살아 있고, 그때 로그는 무슨 일이 있었는지 안 말해 준다.
      - name: 배포 번들 스모크 (workerd)
        timeout-minutes: 5
        run: |
          npx wrangler dev --port 3200 --local &
          WRANGLER_PID=$!
          # 스모크가 실패해도 워커를 반드시 걷는다(run 은 -e 라 실패 시 아래 줄로 안 간다).
          trap 'kill $WRANGLER_PID 2>/dev/null || true' EXIT
          # 준비될 때까지 기다리되 무한정은 아니다 — 안 뜨면 그 자체가 실패다.
          timeout 90 bash -c 'until curl -sf -o /dev/null http://localhost:3200/; do sleep 2; done'
          node scripts/post-deploy-smoke.mjs http://localhost:3200

  e2e:
    name: e2e 스모크 · Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: e2e
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
